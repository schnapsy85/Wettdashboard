<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy · Hermes Agent</title><link rel="icon" href="data:,"><style>
:root{--bg:#0a0b1e;--surface:#15162e;--surface2:#1c1e3b;--text:#f7f8ff;--muted:#b8b9d4;--line:rgba(255,255,255,.09);--cyan:#09d6ff;--green:#20e59a;--warn:#ffb347;--r:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#241456 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.shell{max-width:1400px;margin:auto;padding:0 24px 40px}.site-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:16px;margin:18px 0 34px;background:#15162ef2;box-shadow:0 20px 60px #0004}.site-nav a{color:var(--muted);text-decoration:none}.brand{font-size:20px;font-weight:800;color:#fff!important}.brand span{color:#b15cff}.nav-links{display:flex;gap:8px;overflow:auto}.nav-links a{min-height:44px;padding:10px 13px;display:flex;align-items:center;border-radius:10px;white-space:nowrap}.nav-links a:hover,.nav-links .active{color:#fff;background:linear-gradient(90deg,#6b1cff,#8f2cff)}@media(max-width:700px){.site-nav{align-items:stretch;flex-direction:column;gap:10px}.nav-links{width:100%;flex-wrap:wrap;overflow:visible}.nav-links a{flex:1 1 auto;justify-content:center}}h1{font-size:clamp(34px,5vw,56px);margin:0 0 8px;background:linear-gradient(90deg,#fff,#8f74ff,#ff38bf);-webkit-background-clip:text;color:transparent}.eyebrow,.muted,.meta{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:24px}.status{color:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{border:1px solid var(--line);border-radius:var(--r);background:#15162ef2;box-shadow:0 20px 60px #0004;padding:18px}.kpi{font-size:28px;font-weight:800;color:var(--cyan);margin-top:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.players{display:grid;gap:8px}.player{padding:11px;border:1px solid var(--line);border-radius:12px;background:#101225;display:flex;justify-content:space-between;gap:12px}.badge{padding:3px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.error{border-left:4px solid #ff7080;color:#ffb3bb}.empty{color:var(--muted);padding:12px 0}dl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}dt{color:var(--muted);font-size:12px}dd{margin:3px 0 0;font-weight:700}@media(max-width:800px){.shell{padding:0 16px 30px}.site-nav{align-items:flex-start;gap:12px;flex-direction:column}.nav-links{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}dl{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.grid{grid-template-columns:1fr}.player{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="shell"><nav class="site-nav" aria-label="Hauptnavigation"><a class="brand" href="/">Hermes<span>Agent</span></a><div class="nav-links"><a href="/">Dashboard</a><a href="/tokens.html">Tokenüberwachung</a><a href="/betting">Betting Lab</a><a href="/trading">Trading Testnet</a><a href="/finanzen.html">Finanzen</a><a class="active" href="/fantasy">Fantasy</a></div></nav><header class="top"><div><p class="eyebrow">READ-ONLY · FANTASY COPILOT</p><h1>Fantasy</h1><p class="muted" id="context">Wird geladen …</p></div><div class="status" id="status">● Backend wird geprüft</div></header><main id="app"><section class="grid" id="kpis"></section><section class="card"><div class="section-head"><h2>Matchup</h2><span class="meta">Keine Optimierung</span></div><div id="matchup" class="empty">Wird geladen …</div></section><div class="split"><section class="card"><div class="section-head"><h2>Mein Roster</h2><span class="meta" id="my-count"></span></div><div id="my-roster" class="players"></div></section><section class="card"><div class="section-head"><h2>Gegner</h2><span class="meta" id="opp-count"></span></div><div id="opponent" class="players"></div></section></div><section class="card"><div class="section-head"><h2>Free Agents</h2><span class="meta">max. 25 · read-only</span></div><div id="free-agents" class="players"></div></section><section class="card"><div class="section-head"><h2>League Scoring</h2><span class="meta">Persistierte Backend-Werte</span></div><div id="scoring" class="meta"></div></section></main></div><script>
const $=id=>document.getElementById(id);const esc=v=>{const n=document.createElement('span');n.textContent=String(v??'UNAVAILABLE');return n.innerHTML};
function player(p){const i=p.identity||{},s=p.sleeper||{},m=p.mapping||{},q=p.quality||{},meta=p.metadata||{};return `<div class="player"><div><strong>${esc(i.full_name||s.full_name||s.first_name+' '+s.last_name||'Unbekannt')}</strong><div class="meta">${esc(s.position||i.position||'—')} · ${esc(s.team||i.team||'—')} · ${meta.partial?'Partial Intelligence':'Full Intelligence'}</div></div><span class="badge">${esc(m.status||q.identity||'UNAVAILABLE')}</span></div>`}
function list(id,items){$(id).innerHTML=items?.length?items.map(player).join(''):'<div class="empty">Keine Daten verfügbar.</div>'}
async function load(){try{const r=await fetch('/api/fantasy?include_free_agents=true&free_agent_limit=25');const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Backend nicht erreichbar');$('status').textContent='● Fantasy Backend online';$('context').textContent=`${d.league.name} · Season ${d.context.season} · Week ${d.context.week}`;const q=d.quality_summary||{},m=d.matchup||{};$('kpis').innerHTML=[['Mein Roster',d.user.roster_id],['Gegner',m.opponent_roster_id||'UNAVAILABLE'],['Roster-Spieler',q.players_total],['Partial Intelligence',q.players_partial]].map(x=>`<article class="card"><div class="muted">${x[0]}</div><div class="kpi">${esc(x[1])}</div></article>`).join('');$('matchup').innerHTML=`<dl><div><dt>Mein Team</dt><dd>${esc(d.user.display_name)} · Roster ${esc(m.my_roster_id)}</dd></div><div><dt>Gegner</dt><dd>${esc(d.opponent?.owner?.display_name||'UNAVAILABLE')} · Roster ${esc(m.opponent_roster_id||'UNAVAILABLE')}</dd></div><div><dt>Meine Punkte</dt><dd>${m.my_points==null?'UNAVAILABLE':esc(m.my_points)}</dd></div><div><dt>Gegner-Punkte</dt><dd>${m.opponent_points==null?'UNAVAILABLE':esc(m.opponent_points)}</dd></div></dl>`;list('my-roster',d.my_roster?.all_players);list('opponent',d.opponent?.all_players);$('my-count').textContent=`${d.my_roster?.all_players?.length||0} Spieler`;$('opp-count').textContent=`${d.opponent?.all_players?.length||0} Spieler`;list('free-agents',d.free_agents);const settings=d.league.scoring_settings||{};$('scoring').textContent=Object.entries(settings).map(([k,v])=>`${k}: ${v}`).join(' · ')||'Keine Scoring-Daten verfügbar.'}catch(e){$('status').textContent='● Backend nicht erreichbar';$('app').innerHTML=`<section class="card error"><h2>Fantasy-Daten nicht verfügbar</h2><p>${esc(e.message)}</p><p class="meta">Fantasy Copilot läuft getrennt vom Dashboard. Keine Demo-Daten geladen.</p></section>`}}load();
</script></body></html>
